services:
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 8080
      DATA_DIR: /data
      PUBLIC_DIR: /app/public
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-session-secret}
      MAX_APK_MB: ${MAX_APK_MB:-300}
    volumes:
      - apk_store_data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  apk_store_data:
  caddy_data:
  caddy_config:
